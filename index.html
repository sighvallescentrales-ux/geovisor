<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Geohistórico Interactivo (VGI)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body{
      height:100%;
      margin:0;
    }
    body{
      display:flex;
      flex-direction:column;
      font-family:system-ui,Segoe UI,Roboto,Arial;
      background:#af661d;
      color:#f5f5f4;
    }

    /* Barra superior */
    #top{
      display:flex;
      gap:1rem;
      align-items:flex-start;
      padding:.7rem .9rem;
      background:#4f2d10;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      z-index:1000;
      flex-wrap:wrap;
    }

    .app-title{
      font-weight:700;
      font-size:1.15rem;
      letter-spacing:.05em;
      text-transform:uppercase;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      line-height:1.2;
    }

    .subtitle{
      font-size:.82rem;
      margin-top:.15rem;
      opacity:0.9;
      max-width:300px;
      line-height:1.1;
    }

    .card{
      background:#5c3413;
      color:#f5f5f4;
      border-radius:12px;
      padding:.5rem .7rem;
      display:flex;
      flex-direction:column;
      gap:.35rem;
      font-size:.9rem;
      border:1px solid #8c5930;
    }
    .card-header{
      font-weight:600;
      margin-bottom:.15rem;
      font-size:.9rem;
    }

    select{
      background:#704214;
      color:#f5f5f4;
      border:1px solid #8c5930;
      border-radius:999px;
      padding:.3rem .7rem;
      cursor:pointer;
      font-size:.85rem;
    }

    /* Contenedor del mapa */
    #map-container{
      position:relative;
      flex:1;
    }
    /* Aquí se dibuja el mapa */
    #map{
      position:absolute;
      inset:0;
    }

    /* Panel lateral para los overlays */
    #overlay-panel{
      position:absolute;
      top:1rem;
      right:1rem;
      z-index:1200;
      width:300px;
    }

    .overlay-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:.4rem;
      font-size:.8rem;
      width:100%;
    }

    .overlay-row label{
      display:flex;
      align-items:center;
      gap:.25rem;
      flex:1;
    }

    input[type=range]{
      width:120px;
      margin-left:.3rem;
    }

    /* Footer */
    #footer{
      background:#4f2d10;
      color:#f5f5f4;
      font-size:.78rem;
      text-align:center;
      padding:.25rem .5rem;
      border-top:1px solid #8c5930;
    }
  </style>
</head>
<body>

  <div id="top">
    <div>
      <div class="app-title">Visor Geohistórico Interactivo (VGI)</div>
      <div class="subtitle">Recuperación de los territorios, haciendas y pueblos de los siglos XIX–XX</div>
    </div>

    <!-- MAPAS BASE -->
    <div class="card">
      <div class="card-header">Mapas base</div>
      <select id="base">
        <option value="osm">OSM</option>
        <option value="opentopo" selected>OpenTopo</option>
        <option value="esri">Esri Imagery</option>
      </select>
    </div>
  </div>

  <div id="map-container">
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Panel mapas históricos -->
<div id="overlay-panel" class="card">
  <div class="card-header">Mapas históricos del Distrito Centro</div>
  <div id="overlays"></div>
</div>

<!-- NUEVO: Panel polígonos -->
<div id="geojson-panel" class="card">
  <div class="card-header">Polígonos de Haciendas</div>
  <div id="geojson-controls"></div>
</div>

</div> <!-- cierre de map-container -->

<div id="footer">
    Construido por: Antonio Escobar Ohmstede, Daniela Osorio Crespo y Carlos Alfredo Hernández Guillén
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
    
      const map = L.map("map", {
        center: [17.046, -96.635],
        zoom: 14
      });
    
      /* MAPAS BASE */
      const base = {
        osm: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 20,
          attribution: "© OpenStreetMap"
        }),
        opentopo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "© OpenTopoMap"
        }),
        esri: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
          maxZoom: 20,
          attribution: "© Esri, Maxar"
        })
      };
    
      base.opentopo.addTo(map);
    
      document.getElementById("base").addEventListener("change", e => {
        Object.values(base).forEach(l => map.removeLayer(l));
        base[e.target.value].addTo(map);
      });
    
  /* MAPAS HISTÓRICOS */
const overlayConfigs = [
  {
    id: "aranjuez",
    nombre: "Hacienda Aranjuez",
    url: "./hac_aranjuez/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "candiani_cia",
    nombre: "Haciendas Candiani y Compañía",
    url: "./hac_candiani_cia/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "cinco_seniores",
    nombre: "Hacienda Cinco Señores",
    url: "./hac_cinco_seniores/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_del_carmen",
    nombre: "Hacienda del Carmen",
    url: "./hac_del_carmen/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_del_rosario",
    nombre: "Hacienda del Rosario",
    url: "./hac_del_rosario/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_montoya",
    nombre: "Hacienda Montoya",
    url: "./hac_montoya/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_reyes_mantecon",
    nombre: "Hacienda Reyes Mantecón",
    url: "./hac_reyes_mantecon/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_san_isidro_monjas",
    nombre: "Hacienda San Isidro Monjas",
    url: "./hac_san_isidro_monjas/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_san_isidro_prio",
    nombre: "Hacienda San Isidro Prío",
    url: "./hac_san_isidro_prio/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  },
  {
    id: "hac_san_miguel",
    nombre: "Hacienda San Miguel",
    url: "./hac_san_miguel/{z}/{x}/{y}.png",
    opacidadInicial: 0.6,
    minZoom: 5,
    maxZoom: 20,
    maxNativeZoom: 20
  }
];

const overlayLayers = {};
const overlaysDiv = document.getElementById("overlays");
const geojsonDiv = document.getElementById("geojson-controls");

overlayConfigs.forEach(cfg => {
  const layer = L.tileLayer(cfg.url, {
    opacity: cfg.opacidadInicial,
    minZoom: cfg.minZoom,
    maxZoom: cfg.maxZoom,
    maxNativeZoom: cfg.maxNativeZoom,
    tms: true
  });

  overlayLayers[cfg.id] = layer;

  const row = document.createElement("div");
  row.className = "overlay-row";

  row.innerHTML = `
    <label>
      <input type="checkbox" data-id="${cfg.id}">
      ${cfg.nombre}
    </label>
    <input type="range" min="0" max="1" step="0.05"
           value="${cfg.opacidadInicial}" data-id="${cfg.id}">
  `;

  overlaysDiv.appendChild(row);

  const chk = row.querySelector('input[type="checkbox"]');
  const rng = row.querySelector('input[type="range"]');

  chk.addEventListener("change", e => {
    const lyr = overlayLayers[e.target.dataset.id];
    if (e.target.checked) {
      lyr.addTo(map);
    } else {
      map.removeLayer(lyr);
    }
  });

  rng.addEventListener("input", e => {
    overlayLayers[e.target.dataset.id].setOpacity(parseFloat(e.target.value));
  });
});

/* POLÍGONOS DE HACIENDAS */
const geojsonConfigs = [
  {
    id: "poli_aranjuez",
    nombre: "Polígono Hacienda Aranjuez",
    url: "./geojson/hac_aranjuez.geojson",
    color: "#ff7800"
  }
];

const geojsonLayers = {};

geojsonConfigs.forEach(cfg => {
  fetch(cfg.url)
    .then(response => {
      if (!response.ok) {
        throw new Error("No se pudo cargar " + cfg.url);
      }
      return response.json();
    })
    .then(data => {
      const layer = L.geoJSON(data, {
        style: {
          color: cfg.color,
          weight: 2,
          fillColor: cfg.color,
          fillOpacity: 0.25
        },
        onEachFeature: function (feature, layer) {
          layer.bindPopup(`<strong>${cfg.nombre}</strong>`);
        }
      });

      geojsonLayers[cfg.id] = layer;

      const row = document.createElement("div");
      row.className = "overlay-row";

      row.innerHTML = `
        <label>
          <input type="checkbox" data-id="${cfg.id}">
          ${cfg.nombre}
        </label>
      `;

      geojsonDiv.appendChild(row);

      const chk = row.querySelector('input[type="checkbox"]');

      chk.addEventListener("change", e => {
        const lyr = geojsonLayers[e.target.dataset.id];

        if (e.target.checked) {
          lyr.addTo(map);
          map.fitBounds(lyr.getBounds());
        } else {
          map.removeLayer(lyr);
        }
      });
    })
    .catch(error => {
      console.error("Error cargando GeoJSON:", error);
    });
});
}); // fin DOMContentLoaded
</script>
</body>
</html>
